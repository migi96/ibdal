<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depth Echo — AI services section</title>
  <link rel="stylesheet" href="modernist.css">
  <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
  <script src="depth-echo.js"></script>
  <style>
    body { margin: 0; background: var(--color-bg); font-family: var(--font-body); }
    a { color: var(--color-accent-700); text-decoration: none; }
    a:hover { color: var(--color-accent); }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 56px 24px; }
    .row { display: grid; grid-template-columns: 1fr 520px; border-top: 2px solid var(--color-text); border-bottom: 2px solid var(--color-text); }
    .copy { padding: 56px 48px 48px 0; border-right: 2px solid var(--color-divider); }
    .kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 20px; }
    h2 { font-size: 46px; margin: 0 0 20px; max-width: 12em; text-wrap: pretty; }
    .lede { font-size: 16px; line-height: 1.6; max-width: 34em; margin: 0 0 32px; color: var(--color-neutral-800); }
    .list { border-top: 2px solid var(--color-divider); margin-bottom: 32px; }
    .list div { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--color-divider); font-size: 14px; }
    .list span:first-child { color: var(--color-neutral-600); width: 2.5em; }
    .actions { display: flex; gap: 12px; }
    .stage { padding: 16px 0 24px 40px; }
    .stage-label { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px;
      border-bottom: 1px solid var(--color-divider); font-size: 10px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--color-neutral-600); }
    .stage-box { position: relative; height: 470px; }
    canvas { display: block; width: 100%; height: 100%; }
    .tick { position: absolute; width: 12px; height: 12px; }
    .tick-tl { left: 0; top: 8px; border-left: 2px solid var(--color-accent); border-top: 2px solid var(--color-accent); }
    .tick-br { right: 0; bottom: 8px; border-right: 2px solid var(--color-accent); border-bottom: 2px solid var(--color-accent); }
    @media (max-width: 900px) {
      .row { grid-template-columns: 1fr; }
      .copy { padding: 40px 0 32px; border-right: 0; border-bottom: 2px solid var(--color-divider); }
      h2 { font-size: 34px; }
      .stage { padding: 16px 0 24px; }
      .stage-box { height: 360px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="copy">
        <div class="kicker">AI Services</div>
        <h2>A system that keeps learning after launch.</h2>
        <p class="lede">Every answer is scored, every failure becomes a test case, and the loop runs again next week.</p>
        <div class="list">
          <div><span>01</span><span>Deploy and instrument</span></div>
          <div><span>02</span><span>Score every response</span></div>
          <div><span>03</span><span>Retrain on what failed</span></div>
        </div>
        <div class="actions">
          <a class="btn btn-primary" href="#">Book a technical review</a>
          <a class="btn btn-ghost" href="#">See our work</a>
        </div>
      </div>
      <div class="stage">
        <div class="stage-label"><span>Motion / 02</span><span>Hover to steer</span></div>
        <div class="stage-box">
          <canvas id="stage"></canvas>
          <div class="tick tick-tl"></div>
          <div class="tick tick-br"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var opts = { speed: 1, intensity: 1, pointerFollow: true };
    LoopFX.ready()
      .then(function () { return LoopFX.loadImage('loop.png'); })
      .then(function (img) { LoopFX.depthEcho(document.getElementById('stage'), img, opts); })
      .catch(function (e) { console.warn('Depth Echo failed to start', e); });
  </script>
</body>
</html>
